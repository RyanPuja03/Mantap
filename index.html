<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Kreatif Sinematik</title>
    <style>
        /* 1. RESET & FONT UTAMA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden; /* Mencegah scrollbar muncul */
            background-color: #0b131a; /* Warna cadangan gelap */
        }

        /* 2. BACKGROUND VIDEO SINEMATIK */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Memastikan video memotong rapi sesuai layar */
        }

        /* 3. OVERLAY GELAP (Kunci Efek Sinematik & Kontras Teks) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Memberi efek gradasi gelap kebiruan transparan di atas video */
            background: linear-gradient(135deg, rgba(11, 25, 44, 0.85) 0%, rgba(27, 38, 59, 0.6) 100%);
            z-index: -1;
        }

        /* 4. NAVIGASI (HOME, DLL) */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            color: #ffffff;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .navbar a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            margin-left: 35px;
            letter-spacing: 1px;
            transition: all 0.3s ease; /* Efek halus saat disentuh mouse */
            position: relative;
        }

        /* Efek garis bawah saat menu disorot mouse */
        .navbar a:hover, .navbar a.active {
            color: #ffffff;
        }
        
        .navbar a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #00d2ff; /* Warna aksen cyan terang */
            transition: width 0.3s ease;
        }
        
        .navbar a:hover::after {
            width: 100%;
        }

        /* 5. KONTEN UTAMA (TEKS DI TENGAH) */
        .main-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
        }

        .main-content h1 {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 15px;
            /* Efek bayangan teks tipis agar lebih terbaca */
            text-shadow: 0px 4px 20px rgba(0,0,0,0.5);
        }

        /* Menonjolkan kata kunci */
        .main-content h1 span {
            font-weight: 700;
            color: #00d2ff; 
        }

        .main-content p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            max-width: 600px;
            line-height: 1.8;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        /* Tombol Panggilan Aksi (CTA) */
        .btn-explore {
            display: inline-block;
            padding: 12px 35px;
            border: 2px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.4s ease;
        }

        .btn-explore:hover {
            background-color: #ffffff;
            color: #0b131a;
            transform: translateY(-3px); /* Efek melayang sedikit */
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- 1. Video Background Element -->
    <div class="video-container">
        <!-- Video gratis bertema air bergelombang dari Pexels/Pixabay -->
        <video autoplay loop muted playsinline>
          <source src="vid.mp4" type="video/mp4">
            Browsermu tidak mendukung video HTML5.
        </video>
    </div>

    <!-- 2. Lapisan Kegelapan / Overlay Sinematik -->
    <div class="overlay"></div>

    <!-- 3. Navigasi Atas -->
    <header>
        <div class="logo">Kreatif.Studio</div>
        <nav class="navbar">
            <a href="#" class="active">Home</a>
            <a href="#">Tentang</a>
            <a href="#">Portfolio</a>
            <a href="#">Kontak</a>
        </nav>
    </header>

    <!-- 4. Isi Teks Utama -->
    <main class="main-content">
        <h1>Sisi <span>Kreatif</span> Menanti</h1>
        <p>Menjembatani analisis logis berbasis data dengan estetika visual yang menghidupkan ruang digital.</p>
        <a href="#" class="btn-explore">Lihat Karya</a>
    </main>

</body>
</html>
